export_csv:
  name: Export to CSV
  description: >-
    Export entities, devices, or areas from the registry to a CSV file inside
    the Home Assistant configuration directory.
  fields:
    filename:
      name: Filename
      description: >-
        File to write, relative to the config directory. Must stay inside
        the config directory.
      required: false
      default: entity_export.csv
      example: exports/entities.csv
      selector:
        text:
    return_data:
      name: Return data
      description: >-
        Return columns and rows directly in the service response instead of
        writing a file. Ignores output_format (rows are structured data).
      required: false
      default: false
      selector:
        boolean:
    max_rows:
      name: Max rows
      description: >-
        Cap the number of rows returned when return_data is on. The response
        sets truncated: true when more rows were available.
      required: false
      default: 1000
      selector:
        number:
          min: 1
          mode: box
    export_type:
      name: Export type
      description: >-
        What to export — one row per entity, device, area, floor, or label.
      required: false
      default: entities
      selector:
        select:
          options:
            - entities
            - devices
            - areas
            - floors
            - labels
    include_disabled:
      name: Include disabled
      description: Include disabled entities/devices.
      required: false
      default: true
      selector:
        boolean:
    include_hidden:
      name: Include hidden
      description: Include hidden entities.
      required: false
      default: true
      selector:
        boolean:
    only_enabled:
      name: Only enabled
      description: >-
        Shortcut to exclude everything disabled or hidden (overrides the two
        options above).
      required: false
      default: false
      selector:
        boolean:
    domains:
      name: Domains
      description: >-
        Only include entities in these domains (entities export type only). Pick
        from the list or type any other domain.
      required: false
      example: '["light", "switch"]'
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - light
            - switch
            - sensor
            - binary_sensor
            - climate
            - cover
            - fan
            - lock
            - media_player
            - camera
            - vacuum
            - humidifier
            - water_heater
            - alarm_control_panel
            - number
            - select
            - button
            - scene
            - script
            - automation
            - device_tracker
            - person
            - weather
            - update
            - remote
            - siren
    areas:
      name: Areas
      description: >-
        Only include rows in these areas. The picker returns area IDs; typed
        YAML also accepts area names.
      required: false
      selector:
        area:
          multiple: true
    stale_only:
      name: Stale only
      description: >-
        Only include stale rows (unavailable, orphaned, restored/not provided,
        or not changed within stale_days).
      required: false
      default: false
      selector:
        boolean:
    stale_days:
      name: Stale after (days)
      description: Flag rows whose state has not changed within this many days.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3650
          unit_of_measurement: days
          mode: box
    utf8_bom:
      name: UTF-8 BOM
      description: >-
        Prepend a UTF-8 byte order mark so Excel on Windows renders non-ASCII
        characters correctly (CSV only).
      required: false
      default: false
      selector:
        boolean:
    output_format:
      name: Output format
      description: >-
        File format to write: CSV (default), JSON, or YAML. JSON and YAML are
        lossless structured formats; CSV is best for spreadsheets.
      required: false
      default: csv
      selector:
        select:
          options:
            - csv
            - json
            - yaml
    sort_by:
      name: Sort by
      description: >-
        Column name to sort rows by (e.g. name, area_name, last_changed_days).
        Unknown columns are ignored. Values sort as text.
      required: false
      example: area_name
      selector:
        text:
    sort_dir:
      name: Sort direction
      description: Sort ascending or descending. Only applies when sort_by is set.
      required: false
      default: asc
      selector:
        select:
          options:
            - asc
            - desc
    columns:
      name: Columns
      description: >-
        Ordered list of column names to output; other columns are dropped and
        unknown names are ignored. Overrides preset.
      required: false
      example: '["entity_id", "name", "area_name"]'
      selector:
        object:
    preset:
      name: Column preset
      description: >-
        Named column set for the chosen export type: minimal (all types),
        identity (entities), or stale (entities/devices). Ignored when columns
        is set.
      required: false
      selector:
        select:
          options:
            - minimal
            - identity
            - stale

get_download_url:
  name: Get download URL
  description: >-
    Return a signed, time-limited URL to download the export directly from a
    browser (no auth header needed). Response only — does not write a file.
  fields:
    expires:
      name: Expires (seconds)
      description: How long the signed URL stays valid.
      required: false
      default: 300
      selector:
        number:
          min: 30
          max: 86400
          unit_of_measurement: seconds
          mode: box
    download_filename:
      name: Download filename
      description: >-
        Name for the downloaded file (Content-Disposition). Sanitized to a bare
        basename; the extension is set from output_format. Handy for dated names
        that don't overwrite each other.
      required: false
      example: entities_2026-09-24
      selector:
